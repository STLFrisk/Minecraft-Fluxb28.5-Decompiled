# Flux-RE class identity map
#
# Every entry below is a *claim* with the evidence that supports it. The schema is
# deliberate: a name is only useful to the next analyst if they can check it.
#
#   obf         obfuscated name as it appears in Flux.jar (default package = no dots)
#   name        proposed readable name (what a deobfuscator rename should produce)
#   subsystem   coarse grouping, see mappings/README.md for the vocabulary
#   confidence  confirmed | strong | inferred
#                 confirmed - direct proof in the bytes (extends clause, exact literal,
#                             native flag, or a single call site that fixes the meaning)
#                 strong    - two or more independent signals agree
#                 inferred  - one weak signal; treat as a hypothesis to falsify
#   evidence    what specifically supports it, reproducible from this repository
#   stats       {literals, interesting_literals, referenced_by, native_methods}
#               from mappings/class-index.tsv (generated, do not hand-edit)
#
schema_version: 1
