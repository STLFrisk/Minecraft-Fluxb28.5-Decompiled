      `c.a(L1,L2,lookupClass()).a(L3)` to derive its string-table key.

  - obf: t9d
    name: ZkmFlowPredicate
    subsystem: obfuscation
    confidence: confirmed
    stats: {literals: 44, interesting_literals: 43, referenced_by: 1753, native_methods: 0}
    evidence: >-
      t9d.b() / t9d.c() are the opaque predicates that split ZKM's flow-obfuscated
